name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/dotnet
          sudo docker system prune -a --volumes -f || true
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Sync version from Git tag
        run: node scripts/sync-version.cjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev \
            pkg-config \
            build-essential \
            libglib2.0-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release Desktop App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.ref_name }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folio ${{ github.ref_name }}"
          releaseBody: |
            Folio release ${{ github.ref_name }}.

            ### Included Packages
            - **Windows**: `.msi` and `.exe` installers
            - **Linux**: `.deb` and `.AppImage` packages
            - **Android**: `.apk` packages
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    name: Build Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo docker system prune -a --volumes -f || true
          sudo rm -rf /var/lib/docker || true
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Sync version from Git tag
        run: node scripts/sync-version.cjs

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Set NDK_HOME environment variable
        run: |
          if [ -n "$ANDROID_NDK_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK_ROOT" ]; then
            echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          fi

      - name: Install Rust stable and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'folio' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'foliopassword' }}
        run: |
          mkdir -p src-tauri/gen/android
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using Android signing keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/upload.keystore
            cat <<EOF > src-tauri/gen/android/keystore.properties
          password=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload.keystore
          EOF
          else
            echo "Generating self-signed release keystore for CI build..."
            keytool -genkeypair -v \
              -keystore src-tauri/gen/android/upload.keystore \
              -alias folio-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass foliopassword \
              -keypass foliopassword \
              -dname "CN=Folio, OU=Mobile, O=Folio, L=Unknown, S=Unknown, C=US"
            cat <<EOF > src-tauri/gen/android/keystore.properties
          password=foliopassword
          keyAlias=folio-release
          storeFile=upload.keystore
          EOF
          fi

      - name: Build Android APK
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: npm run tauri android build -- --apk

      - name: Collect Android APK artifacts
        run: |
          mkdir -p release-apks
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} release-apks/ \;
          echo "Collected APKs:"
          ls -la release-apks/

      - name: Upload Android APKs to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apks/*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
