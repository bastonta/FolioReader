<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio — E-Book Reader</title>
    <script>
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('foliate_reader_settings') || '{}');
          var theme = settings.theme || 'light';
          document.documentElement.className = 'theme-' + theme;
          var themeColorMeta = document.getElementById('meta-theme-color');
          if (themeColorMeta) {
            if (theme === 'dark') themeColorMeta.content = '#1e1e1e';
            else if (theme === 'sepia') themeColorMeta.content = '#fbf0d9';
            else if (theme === 'gray') themeColorMeta.content = '#2e3440';
            else themeColorMeta.content = '#ffffff';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .theme-light { --bg-splash: #ffffff; --text-splash: #2e3436; --text-subtle-splash: #86848d; --accent-splash: #3584e4; }
      .theme-dark  { --bg-splash: #1e1e1e; --text-splash: #ffffff; --text-subtle-splash: #8892b0; --accent-splash: #3584e4; }
      .theme-sepia { --bg-splash: #fbf0d9; --text-splash: #5f4b32; --text-subtle-splash: #9e8464; --accent-splash: #8f6b32; }
      .theme-gray  { --bg-splash: #2e3440; --text-splash: #eceff4; --text-subtle-splash: #8892b0; --accent-splash: #88c0d0; }

      .android-splash-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: var(--bg-splash, #ffffff);
        color: var(--text-splash, #2e3436);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        z-index: 99999;
      }
      .android-splash-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 24px;
      }
      .android-splash-icon-wrapper {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: android-splash-scale-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .android-splash-icon {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
      }
      .android-splash-spinner-wrapper {
        margin-top: 36px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .android-splash-spinner {
        width: 36px;
        height: 36px;
        animation: android-splash-rotate 1.4s linear infinite;
      }
      .android-splash-spinner-track {
        stroke: rgba(128, 128, 128, 0.15);
      }
      .android-splash-spinner-head {
        stroke: var(--accent-splash, #3584e4);
        stroke-linecap: round;
        stroke-dasharray: 80, 200;
        stroke-dashoffset: 0;
        animation: android-splash-dash 1.4s ease-in-out infinite;
      }
      .android-splash-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding-bottom: 8px;
        animation: android-splash-fade-in 0.4s ease forwards;
      }
      .android-splash-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-splash, #2e3436);
      }
      .android-splash-subtitle {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--text-subtle-splash, #86848d);
        text-transform: uppercase;
      }
      @keyframes android-splash-scale-in {
        0% { opacity: 0; transform: scale(0.88); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes android-splash-fade-in {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes android-splash-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes android-splash-dash {
        0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
        100% { stroke-dasharray: 90, 200; stroke-dashoffset: -125px; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="android-splash-container" aria-label="Loading Folio">
        <div class="android-splash-center">
          <div class="android-splash-icon-wrapper">
            <img src="/icon.png" alt="Folio" class="android-splash-icon" draggable="false" />
          </div>
          <div class="android-splash-spinner-wrapper" aria-hidden="true">
            <svg class="android-splash-spinner" viewBox="0 0 48 48">
              <circle class="android-splash-spinner-track" cx="24" cy="24" r="18" fill="none" stroke-width="3.5" />
              <circle class="android-splash-spinner-head" cx="24" cy="24" r="18" fill="none" stroke-width="3.5" />
            </svg>
          </div>
        </div>
        <div class="android-splash-footer">
          <span class="android-splash-title">Folio</span>
          <span class="android-splash-subtitle">E-Book Reader</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
